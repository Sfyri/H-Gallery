name: h_gallery_mobile
description: "Companion Android di H-Gallery per gallerie locali e sincronizzazione con Windows."
publish_to: 'none'

# La versione di release verrà allineata con Windows nella fase Release Candidate.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.14.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
